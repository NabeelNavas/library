<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">L</span>
      <div>
        <h1>My Library</h1>
        <p id="library-summary">0 books</p>
      </div>
    </div>
    <button class="button button-primary" id="new-book-button">New Book</button>
  </header>

  <main id="library" class="library" aria-label="Books in your library"></main>

  <p id="empty-message" class="empty-message" hidden>
    Your library is empty. Add a book to get started.
  </p>

  <dialog id="book-dialog">
    <form id="book-form">
      <div class="dialog-header">
        <h2>Add a new book</h2>
        <button type="button" class="icon-button" id="close-dialog" aria-label="Close dialog">×</button>
      </div>

      <label for="title">Title</label>
      <input type="text" id="title" name="title" required>

      <label for="author">Author</label>
      <input type="text" id="author" name="author" required>

      <label for="pages">Number of pages</label>
      <input type="number" id="pages" name="pages" min="1" step="1" required>

      <label class="checkbox-row" for="read">
        <input type="checkbox" id="read" name="read">
        I have already read this book
      </label>

      <button type="submit" class="button button-primary">Add to library</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
